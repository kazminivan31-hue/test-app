plugins {
    id 'com.android.application'
}

android {
    compileSdk 19
    buildToolsVersion "19.1.0"

    defaultConfig {
        applicationId "com.burmaldamarket.app"
        minSdkVersion 9
        targetSdkVersion 19
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
